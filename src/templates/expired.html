{% extends "base.html" %}
{% block content %}
<h2>This link has expired</h2>
<p><strong>tou.ro/{{ slug }}</strong> is no longer available.</p>
{% if expires_at %}
<p class="muted">Expired on {{ expires_at }}.</p>
{% endif %}
<div class="auth-links">
    <p><a href="{{ url_for('index') }}">&larr; Back to your links</a></p>
</div>
{% endblock %}
