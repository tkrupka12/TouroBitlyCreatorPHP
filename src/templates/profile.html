{% extends "base.html" %}
{% block content %}
<h2>Profile</h2>
<p class="muted">Change your username or password. Enter your current password to confirm the change.</p>

<form method="POST">
    <div class="form-group">
        <label>Current password</label>
        <input type="password" name="current_password" required>
    </div>
    <div class="form-group">
        <label>New username <span class="muted" style="font-weight: normal;">(leave unchanged to keep)</span></label>
        <input type="text" name="new_username" value="{{ current_user.username }}">
    </div>
    <div class="form-group">
        <label>New password <span class="muted" style="font-weight: normal;">(leave blank to keep)</span></label>
        <input type="password" name="new_password" minlength="6">
    </div>
    <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password">
    </div>
    <button type="submit">Save Changes</button>
</form>
{% endblock %}
